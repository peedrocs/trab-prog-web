<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Papelaria MGP</title>
    <link rel="stylesheet" href="../../src/main/resources/static/css/estilo.css">
    <script src="../../src/main/resources/static/js/script.js" defer></script>
</head>
<body>
<header class="cabecalho">
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
    <div class="container cabecalho-conteudo">
        <a class="logo" href="catalogo.html">Papelaria MGP</a>
        <details class="menu-sanfona">
            <summary><span aria-hidden="true">☰</span> Menu</summary>
            <nav aria-label="Menu principal">
                <ul class="menu">
                    <li><a href="catalogo.html">Catálogo</a></li>
                    <li><a href="carrinho.html">Carrinho <span class="contador">(2<span class="visualmente-oculto"> itens</span>)</span></a></li>
                    <li><a href="login.html" aria-current="true">Entrar</a></li>
                </ul>
            </nav>
        </details>
    </div>
</header>
<main id="conteudo" class="container">
    <section class="formulario formulario-centralizado">
        <h1>Entrar</h1>

        <form action="catalogo.html" method="get">
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" autocomplete="username" required>
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" autocomplete="current-password" required>
            </div>
            <div class="acoes-formulario">
                <button type="submit" class="botao">Entrar</button>
            </div>
        </form>

        <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </section>
</main>
<footer class="rodape">
    <div class="container">
        <p>&copy; Papelaria MGP</p>
    </div>
</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta | Papelaria MGP</title>
    <link rel="stylesheet" href="../../src/main/resources/static/css/estilo.css">
    <script src="../../src/main/resources/static/js/script.js" defer></script>
</head>
<body>
<header class="cabecalho">
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
    <div class="container cabecalho-conteudo">
        <a class="logo" href="catalogo.html">Papelaria MGP</a>
        <details class="menu-sanfona">
            <summary><span aria-hidden="true">☰</span> Menu</summary>
            <nav aria-label="Menu principal">
                <ul class="menu">
                    <li><a href="catalogo.html">Catálogo</a></li>
                    <li><a href="carrinho.html">Carrinho <span class="contador">(2<span class="visualmente-oculto"> itens</span>)</span></a></li>
                    <li><a href="login.html">Entrar</a></li>
                </ul>
            </nav>
        </details>
    </div>
</header>
<main id="conteudo" class="container">
    <section class="formulario formulario-centralizado">
        <h1>Criar conta</h1>

        <form action="login.html" method="get">
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" value="Maria Silva" required maxlength="100" autocomplete="name">
            </div>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" value="maria@email" required autocomplete="email" aria-invalid="true" aria-describedby="email-erro">
                <p class="erro-campo" id="email-erro">E-mail inválido</p>
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required minlength="6" maxlength="72" autocomplete="new-password" aria-describedby="senha-dica">
                <p class="dica" id="senha-dica">De 6 a 72 caracteres</p>
            </div>
            <div class="acoes-formulario">
                <button type="submit" class="botao">Criar conta</button>
            </div>
        </form>

        <p>Já tem conta? <a href="login.html">Entrar</a></p>
    </section>
</main>
<footer class="rodape">
    <div class="container">
        <p>&copy; Papelaria MGP</p>
    </div>
</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caneta esferográfica azul | Papelaria MGP</title>
    <link rel="stylesheet" href="../../src/main/resources/static/css/estilo.css">
    <script src="../../src/main/resources/static/js/script.js" defer></script>
</head>
<body>
<header class="cabecalho">
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
    <div class="container cabecalho-conteudo">
        <a class="logo" href="catalogo.html">Papelaria MGP</a>
        <details class="menu-sanfona">
            <summary><span aria-hidden="true">☰</span> Menu</summary>
            <nav aria-label="Menu principal">
                <ul class="menu">
                    <li><a href="catalogo.html" aria-current="true">Catálogo</a></li>
                    <li><a href="carrinho.html">Carrinho <span class="contador">(2<span class="visualmente-oculto"> itens</span>)</span></a></li>
                    <li><a href="login.html">Entrar</a></li>
                </ul>
            </nav>
        </details>
    </div>
</header>
<main id="conteudo" class="container">
    <p><a href="catalogo.html">Voltar ao catálogo</a></p>

    <section class="detalhe-produto" aria-labelledby="nome-produto">
        <img src="../../src/main/resources/static/imagens/caneta.svg" alt="Caneta esferográfica azul">
        <div>
            <p class="categoria-produto">Canetas</p>
            <h1 id="nome-produto">Caneta esferográfica azul</h1>
            <p class="preco">R$ 2,50</p>
            <p><span class="selo selo-disponivel">Em estoque</span> <span class="texto-suave">(120 unidades)</span></p>
            <p>Caneta esferográfica com tinta azul, ponta média de 1,0 mm e escrita macia. Ideal para o dia a dia.</p>
            <form class="form-carrinho" action="carrinho.html" method="get">
                <div class="campo">
                    <label for="quantidade">Quantidade</label>
                    <input type="number" id="quantidade" name="quantidade" min="1" max="120" value="1" required>
                </div>
                <button type="submit" class="botao">Adicionar ao carrinho</button>
            </form>
        </div>
    </section>
</main>
<footer class="rodape">
    <div class="container">
        <p>&copy; Papelaria MGP</p>
    </div>
</footer>
</body>
</html>

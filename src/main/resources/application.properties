spring.application.name=lojaonline

# Datasource - as credenciais batem com o compose.yaml (Docker Compose Support sobe o container sozinho)
spring.datasource.url=jdbc:mysql://localhost:3306/loja_online
spring.datasource.username=loja_user
spring.datasource.password=loja_pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false

# sessão só por cookie (evita o ";jsessionid" nas URLs)
server.servlet.session.tracking-modes=cookie

spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

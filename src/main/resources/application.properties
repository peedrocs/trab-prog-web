spring.application.name=lojaonline

# chaves do Mercado Pago, do Google e do e-mail ficam no arquivo .env (fora do Git) ou em variaveis de ambiente
spring.config.import=optional:file:.env[.properties]

# banco MySQL do compose.yaml (o Spring sobe o container ao iniciar)
spring.datasource.url=jdbc:mysql://localhost:3306/loja_online
spring.datasource.username=loja_user
spring.datasource.password=loja_pass

# cria e atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false

# sessao apenas por cookie, sem jsessionid na URL
server.servlet.session.tracking-modes=cookie

spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# endereco da loja, usado nos links dos e-mails e na volta do Mercado Pago
loja.url=${LOJA_URL:http://localhost:8080}

# imagens enviadas pelo admin ficam na pasta uploads e sao servidas junto com o static
loja.pasta-uploads=uploads
spring.web.resources.static-locations=classpath:/static/,file:${loja.pasta-uploads}/
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# e-mail (na apresentacao usamos a caixa de teste do Mailtrap)
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
loja.email.remetente=${MAIL_REMETENTE:nao-responda@papelariamgp.com.br}

# atras do ngrok: usa o https e o dominio originais ao montar a redirect_uri
server.forward-headers-strategy=framework

# login com Google (sem as chaves o resto do sistema funciona, so o botao do Google nao)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:sem-chave}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:sem-chave}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Mercado Pago (credenciais da conta de teste do vendedor)
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}

spring.application.name=lojaonline

# banco MySQL do compose.yaml (o Spring sobe o container ao iniciar)
spring.datasource.url=jdbc:mysql://localhost:3306/loja_online
spring.datasource.username=loja_user
spring.datasource.password=loja_pass

# cria e atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false

# sessao apenas por cookie, sem jsessionid na URL
server.servlet.session.tracking-modes=cookie

spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Produtos')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecalho('admin')}"></header>
<main id="conteudo" class="container">
    <nav th:replace="~{fragmentos :: menuAdmin('produtos')}"></nav>
    <div th:replace="~{fragmentos :: mensagens}"></div>

    <div class="barra-titulo">
        <h1>Produtos</h1>
        <a class="botao" th:href="@{/admin/produtos/novo}">Novo produto</a>
    </div>

    <p class="vazio" th:if="${#lists.isEmpty(produtos)}">Nenhum produto cadastrado.</p>

    <div class="tabela-container" th:unless="${#lists.isEmpty(produtos)}">
        <table class="tabela">
            <caption class="visualmente-oculto">Produtos cadastrados</caption>
            <thead>
                <tr>
                    <th scope="col">Imagem</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Categoria</th>
                    <th scope="col" class="numero">Preço</th>
                    <th scope="col" class="numero">Estoque</th>
                    <th scope="col">Situação</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="produto : ${produtos}">
                    <td><img class="miniatura" alt="" th:src="@{${produto.imagemUrl ?: '/imagens/sem-imagem.svg'}}"></td>
                    <td th:text="${produto.nome}">Produto</td>
                    <td th:text="${produto.categoria.nome}">Categoria</td>
                    <td class="numero" th:text="${#numbers.formatCurrency(produto.preco)}">R$ 0,00</td>
                    <td class="numero">
                        <span th:text="${produto.estoque}">0</span>
                        <span class="selo selo-indisponivel" th:if="${produto.estoque == 0}">Sem estoque</span>
                    </td>
                    <td th:text="${produto.ativo} ? 'Ativo' : 'Desativado'">Ativo</td>
                    <td>
                        <div class="acoes">
                            <a class="botao botao-secundario botao-pequeno"
                               th:href="@{/admin/produtos/{id}/editar(id=${produto.id})}"
                               th:aria-label="|Editar ${produto.nome}|">Editar</a>
                            <a class="botao botao-perigo botao-pequeno"
                               th:href="@{/admin/exclusao(tipo='PRODUTO', busca=${produto.nome}, id=${produto.id})}"
                               th:aria-label="|Excluir ${produto.nome}|">Excluir</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>

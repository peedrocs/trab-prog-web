<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Excluir produto')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecalho('admin')}"></header>
<main id="conteudo" class="container">
    <nav th:replace="~{fragmentos :: menuAdmin('produtos')}"></nav>

    <section class="formulario">
        <h1>Excluir produto</h1>
        <p>Deseja excluir o produto <strong th:text="${produto.nome}">Produto</strong>? Esta ação não pode ser desfeita.</p>
        <dl>
            <dt>Categoria</dt>
            <dd th:text="${produto.categoria.nome}">Categoria</dd>
            <dt>Preço</dt>
            <dd th:text="${#numbers.formatCurrency(produto.preco)}">R$ 0,00</dd>
            <dt>Estoque</dt>
            <dd th:text="${produto.estoque == 1} ? '1 unidade' : |${produto.estoque} unidades|">0 unidades</dd>
        </dl>
        <p class="dica">Produto que já foi vendido não pode ser excluído. Nesse caso, deixe o estoque em zero.</p>
        <form th:action="@{/admin/produtos/{id}/excluir(id=${produto.id})}" method="post">
            <div class="acoes-formulario">
                <button type="submit" class="botao botao-perigo">Excluir</button>
                <a class="botao botao-secundario" th:href="@{/admin/produtos}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>

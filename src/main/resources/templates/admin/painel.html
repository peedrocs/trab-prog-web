<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Painel administrativo')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecalho('admin')}"></header>
<main id="conteudo" class="container">
    <nav th:replace="~{fragmentos :: menuAdmin('painel')}"></nav>
    <div th:replace="~{fragmentos :: mensagens}"></div>

    <h1>Painel administrativo</h1>

    <ul class="painel-cards">
        <li class="card-numero">
            <strong th:text="${totalProdutos}">0</strong>
            Produtos cadastrados
        </li>
        <li class="card-numero">
            <strong th:text="${produtosSemEstoque}">0</strong>
            Produtos sem estoque
        </li>
        <li class="card-numero">
            <strong th:text="${pedidosAguardando}">0</strong>
            Pedidos aguardando pagamento
        </li>
        <li class="card-numero">
            <strong th:text="${totalUsuarios}">0</strong>
            Usuários cadastrados
        </li>
    </ul>

    <section>
        <h2>Atalhos</h2>
        <div class="acoes">
            <a class="botao" th:href="@{/admin/produtos/novo}">Novo produto</a>
            <a class="botao" th:href="@{/admin/pedidos}">Gerenciar pedidos</a>
            <a class="botao" th:href="@{/admin/categorias/novo}">Nova categoria</a>
            <a class="botao" th:href="@{/admin/cupons/novo}">Novo cupom</a>
        </div>
    </section>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Administração')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecalho('admin')}"></header>
<main id="conteudo" class="container">
    <h1>Administração</h1>

    <ul class="painel-cards">
        <li class="card-numero">
            <strong th:text="${totalProdutos}">0</strong>
            Produtos cadastrados
        </li>
        <li class="card-numero">
            <strong th:text="${totalCategorias}">0</strong>
            Categorias cadastradas
        </li>
        <li class="card-numero">
            <strong th:text="${totalPedidos}">0</strong>
            Pedidos registrados
        </li>
        <li class="card-numero">
            <strong th:text="${totalUsuarios}">0</strong>
            Usuários cadastrados
        </li>
    </ul>

    <section>
        <h2>Cadastros previstos</h2>
        <p>Esta área receberá os cadastros de produtos, categorias, pedidos e usuários na próxima etapa.</p>
    </section>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>

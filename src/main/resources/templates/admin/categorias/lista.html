<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Categorias')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecalho('admin')}"></header>
<main id="conteudo" class="container">
    <nav th:replace="~{fragmentos :: menuAdmin('categorias')}"></nav>
    <div th:replace="~{fragmentos :: mensagens}"></div>

    <div class="barra-titulo">
        <div>
            <h1>Categorias</h1>
            <p class="dica">Categorias com produtos não podem ser excluídas.</p>
        </div>
        <a class="botao" th:href="@{/admin/categorias/novo}">Nova categoria</a>
    </div>

    <p class="vazio" th:if="${#lists.isEmpty(categorias)}">Nenhuma categoria cadastrada.</p>

    <div class="tabela-container" th:unless="${#lists.isEmpty(categorias)}">
        <table class="tabela">
            <caption class="visualmente-oculto">Categorias cadastradas</caption>
            <thead>
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="categoria : ${categorias}">
                    <td th:text="${categoria.nome}">Canetas</td>
                    <td>
                        <div class="acoes">
                            <a class="botao botao-secundario botao-pequeno"
                               th:href="@{/admin/categorias/{id}/editar(id=${categoria.id})}"
                               th:aria-label="|Editar ${categoria.nome}|">Editar</a>
                            <form method="post" th:action="@{/admin/categorias/{id}/excluir(id=${categoria.id})}"
                                  th:data-confirmar="|Deseja excluir a categoria ${categoria.nome}?|">
                                <button type="submit" class="botao botao-perigo botao-pequeno"
                                        th:aria-label="|Excluir ${categoria.nome}|">Excluir</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>

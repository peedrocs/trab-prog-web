<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Usuários')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecalho('admin')}"></header>
<main id="conteudo" class="container">
    <nav th:replace="~{fragmentos :: menuAdmin('usuarios')}"></nav>
    <div th:replace="~{fragmentos :: mensagens}"></div>

    <div class="barra-titulo">
        <div>
            <h1>Usuários</h1>
            <p class="dica">Usuários inativos não conseguem entrar. Ao mudar o perfil ou a situação de alguém, a sessão dessa pessoa é encerrada.</p>
        </div>
    </div>

    <p class="vazio" th:if="${#lists.isEmpty(usuarios)}">Nenhum usuário cadastrado.</p>

    <div class="tabela-container" th:unless="${#lists.isEmpty(usuarios)}">
        <table class="tabela">
            <caption class="visualmente-oculto">Usuários cadastrados</caption>
            <thead>
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">E-mail</th>
                    <th scope="col">CPF</th>
                    <th scope="col">Perfil</th>
                    <th scope="col">Situação</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.nome}">Maria Souza</td>
                    <td th:text="${usuario.email}">maria@email.com</td>
                    <td th:text="${#strings.isEmpty(usuario.cpf)} ? '—' : ${usuario.cpf}">—</td>
                    <td>
                        <span class="selo" th:text="${usuario.perfil.name() == 'ADMIN'} ? 'Administrador' : 'Cliente'">Cliente</span>
                    </td>
                    <td>
                        <span class="selo selo-disponivel" th:if="${usuario.ativo}">Ativo</span>
                        <span class="selo selo-indisponivel" th:unless="${usuario.ativo}">Inativo</span>
                    </td>
                    <td>
                        <div class="acoes" th:if="${usuario.email != #authentication.name}">
                            <form method="post" th:action="@{/admin/usuarios/{id}/perfil(id=${usuario.id})}">
                                <button type="submit" class="botao botao-secundario botao-pequeno"
                                        th:if="${usuario.perfil.name() == 'ADMIN'}"
                                        th:aria-label="|Tornar cliente o usuário ${usuario.nome}|">Tornar cliente</button>
                                <button type="submit" class="botao botao-secundario botao-pequeno"
                                        th:unless="${usuario.perfil.name() == 'ADMIN'}"
                                        th:aria-label="|Tornar administrador o usuário ${usuario.nome}|">Tornar administrador</button>
                            </form>
                            <form method="post" th:action="@{/admin/usuarios/{id}/ativo(id=${usuario.id})}"
                                  th:if="${usuario.ativo}"
                                  th:data-confirmar="|Deseja desativar o usuário ${usuario.nome}?|">
                                <button type="submit" class="botao botao-perigo botao-pequeno"
                                        th:aria-label="|Desativar ${usuario.nome}|">Desativar</button>
                            </form>
                            <form method="post" th:action="@{/admin/usuarios/{id}/ativo(id=${usuario.id})}"
                                  th:unless="${usuario.ativo}">
                                <button type="submit" class="botao botao-secundario botao-pequeno"
                                        th:aria-label="|Ativar ${usuario.nome}|">Ativar</button>
                            </form>
                        </div>
                        <span class="texto-suave" th:if="${usuario.email == #authentication.name}">Sua conta</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head(${cupom.id == null} ? 'Novo cupom' : 'Editar cupom')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecalho('admin')}"></header>
<main id="conteudo" class="container">
    <nav th:replace="~{fragmentos :: menuAdmin('cupons')}"></nav>
    <div th:replace="~{fragmentos :: mensagens}"></div>

    <h1 th:text="${cupom.id == null} ? 'Novo cupom' : 'Editar cupom'">Novo cupom</h1>

    <form class="formulario" method="post" th:action="@{/admin/cupons/salvar}" th:object="${cupom}">
        <input type="hidden" th:field="*{id}">

        <div class="campo">
            <label for="codigo">Código</label>
            <input type="text" th:field="*{codigo}" required maxlength="30"
                   th:aria-invalid="${#fields.hasErrors('codigo')}"
                   th:aria-describedby="${#fields.hasErrors('codigo')} ? 'codigo-dica codigo-erro' : 'codigo-dica'">
            <p class="dica" id="codigo-dica">Será salvo em letras maiúsculas.</p>
            <p class="erro-campo" id="codigo-erro" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></p>
        </div>

        <div class="campo">
            <label for="tipo">Tipo de desconto</label>
            <select th:field="*{tipo}" required
                    th:aria-invalid="${#fields.hasErrors('tipo')}"
                    th:aria-describedby="${#fields.hasErrors('tipo')} ? 'tipo-erro'">
                <option value="">Selecione o tipo</option>
                <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo.descricao}">Percentual (%)</option>
            </select>
            <p class="erro-campo" id="tipo-erro" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></p>
        </div>

        <div class="campo">
            <label for="valor">Valor do desconto</label>
            <input type="number" th:field="*{valor}" step="0.01" min="0.01" required
                   th:aria-invalid="${#fields.hasErrors('valor')}"
                   th:aria-describedby="${#fields.hasErrors('valor')} ? 'valor-dica valor-erro' : 'valor-dica'">
            <p class="dica" id="valor-dica">Para percentual, informe um valor até 100.</p>
            <p class="erro-campo" id="valor-erro" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></p>
        </div>

        <div class="campo">
            <label for="validade">Validade</label>
            <input type="date" th:field="*{validade}" required
                   th:aria-invalid="${#fields.hasErrors('validade')}"
                   th:aria-describedby="${#fields.hasErrors('validade')} ? 'validade-erro'">
            <p class="erro-campo" id="validade-erro" th:if="${#fields.hasErrors('validade')}" th:errors="*{validade}"></p>
        </div>

        <div class="acoes-formulario">
            <button type="submit" class="botao">Salvar</button>
            <a class="botao botao-secundario" th:href="@{/admin/cupons}">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>

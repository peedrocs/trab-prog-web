<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Cupons')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecalho('admin')}"></header>
<main id="conteudo" class="container">
    <nav th:replace="~{fragmentos :: menuAdmin('cupons')}"></nav>
    <div th:replace="~{fragmentos :: mensagens}"></div>

    <div class="barra-titulo">
        <h1>Cupons</h1>
        <a class="botao" th:href="@{/admin/cupons/novo}">Novo cupom</a>
    </div>

    <p class="vazio" th:if="${#lists.isEmpty(cupons)}">Nenhum cupom cadastrado.</p>

    <div class="tabela-container" th:unless="${#lists.isEmpty(cupons)}">
        <table class="tabela">
            <caption class="visualmente-oculto">Cupons cadastrados</caption>
            <thead>
                <tr>
                    <th scope="col">Código</th>
                    <th scope="col">Desconto</th>
                    <th scope="col">Validade</th>
                    <th scope="col">Situação</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cupom : ${cupons}">
                    <td th:text="${cupom.codigo}">CUPOM10</td>
                    <td th:text="${cupom.descricaoDesconto}">10%</td>
                    <td th:text="${#temporals.format(cupom.validade, 'dd/MM/yyyy')}">01/01/2026</td>
                    <td>
                        <span th:if="${!cupom.ativo}">Desativado</span>
                        <span th:if="${cupom.ativo and cupom.estaVencido(hoje)}">Vencido</span>
                        <span th:if="${cupom.ativo and !cupom.estaVencido(hoje)}">Válido</span>
                    </td>
                    <td>
                        <div class="acoes">
                            <a class="botao botao-secundario botao-pequeno"
                               th:href="@{/admin/cupons/{id}/editar(id=${cupom.id})}"
                               th:aria-label="|Editar ${cupom.codigo}|">Editar</a>
                            <a class="botao botao-perigo botao-pequeno"
                               th:href="@{/admin/exclusao(tipo='CUPOM', busca=${cupom.codigo}, id=${cupom.id})}"
                               th:aria-label="|Excluir ${cupom.codigo}|">Excluir</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>

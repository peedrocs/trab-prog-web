<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Erro')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecalho('')}"></header>
<main id="conteudo" class="container">
    <h1 th:switch="${status}">
        <span th:case="403">Acesso negado</span>
        <span th:case="404">Página não encontrada</span>
        <span th:case="*">Algo deu errado</span>
    </h1>

    <p th:text="|Código do erro: ${status}|">Código do erro: 500</p>

    <p><a class="botao" th:href="@{/}">Voltar ao catálogo</a></p>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>

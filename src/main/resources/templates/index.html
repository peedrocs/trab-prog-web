<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Catálogo de produtos')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecalho('catalogo')}"></header>
<main id="conteudo" class="container">
    <div th:replace="~{fragmentos :: mensagens}"></div>

    <h1>Catálogo de produtos</h1>

    <form class="filtros" th:action="@{/}" method="get" role="search" aria-label="Filtrar produtos">
        <div class="campo">
            <label for="busca">Buscar por nome</label>
            <input type="search" id="busca" name="busca" th:value="${busca}">
        </div>
        <div class="campo">
            <label for="categoriaId">Categoria</label>
            <select id="categoriaId" name="categoriaId">
                <option value="">Todas as categorias</option>
                <option th:each="categoria : ${categorias}" th:value="${categoria.id}" th:text="${categoria.nome}"
                        th:selected="${categoria.id == categoriaSelecionada}">Categoria</option>
            </select>
        </div>
        <div class="campo">
            <label for="ordem">Ordenar por</label>
            <select id="ordem" name="ordem">
                <option value="nome" th:selected="${ordem == 'nome'}">Nome</option>
                <option value="menor-preco" th:selected="${ordem == 'menor-preco'}">Menor preço</option>
                <option value="maior-preco" th:selected="${ordem == 'maior-preco'}">Maior preço</option>
                <option value="mais-vendidos" th:selected="${ordem == 'mais-vendidos'}">Mais vendidos</option>
            </select>
        </div>
        <button type="submit" class="botao">Filtrar</button>
        <a class="botao botao-secundario" th:href="@{/}"
           th:if="${!#strings.isEmpty(busca) or categoriaSelecionada != null or ordem != 'nome'}">Limpar filtros</a>
    </form>

    <p class="texto-suave" th:unless="${produtos.empty}"
       th:text="${produtos.totalElements == 1} ? '1 produto encontrado' : |${produtos.totalElements} produtos encontrados|">8 produtos encontrados</p>

    <ul class="grade-produtos" th:unless="${produtos.empty}">
        <li th:each="produto : ${produtos.content}">
            <article class="card-produto">
                <img alt="" th:src="@{${produto.imagemUrl ?: '/imagens/sem-imagem.svg'}}">
                <div class="card-produto-corpo">
                    <h2><a th:href="@{/produtos/{id}(id=${produto.id})}" th:text="${produto.nome}">Nome do produto</a></h2>
                    <p class="categoria-produto" th:text="${produto.categoria.nome}">Categoria</p>
                    <p class="preco" th:text="${#numbers.formatCurrency(produto.preco)}">R$ 0,00</p>
                    <p>
                        <span class="selo selo-disponivel" th:if="${produto.disponivel}">Em estoque</span>
                        <span class="selo selo-indisponivel" th:unless="${produto.disponivel}">Indisponível</span>
                    </p>
                    <form th:if="${produto.disponivel}" th:action="@{/carrinho/adicionar}" method="post">
                        <input type="hidden" name="produtoId" th:value="${produto.id}">
                        <input type="hidden" name="quantidade" value="1">
                        <button type="submit" class="botao"
                                th:aria-label="|Adicionar ao carrinho: ${produto.nome}|">Adicionar ao carrinho</button>
                    </form>
                    <button class="botao" type="button" disabled th:unless="${produto.disponivel}"
                            th:aria-label="|Indisponível: ${produto.nome}|">Indisponível</button>
                </div>
            </article>
        </li>
    </ul>

    <p class="vazio" th:if="${produtos.empty}">Nenhum produto encontrado.</p>

    <nav class="paginacao" aria-label="Páginas do catálogo" th:if="${produtos.totalPages > 1}">
        <a class="botao botao-secundario" th:if="${produtos.hasPrevious()}"
           th:href="@{/(busca=${busca}, categoriaId=${categoriaSelecionada}, ordem=${ordem}, pagina=${produtos.number})}">Página anterior</a>
        <span th:text="|Página ${produtos.number + 1} de ${produtos.totalPages}|">Página 1 de 2</span>
        <a class="botao botao-secundario" th:if="${produtos.hasNext()}"
           th:href="@{/(busca=${busca}, categoriaId=${categoriaSelecionada}, ordem=${ordem}, pagina=${produtos.number + 2})}">Próxima página</a>
    </nav>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>

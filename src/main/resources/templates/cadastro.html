<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Criar conta')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecalho('cadastro')}"></header>
<main id="conteudo" class="container">
    <section class="formulario formulario-centralizado">
        <h1>Criar conta</h1>
        <div th:replace="~{fragmentos :: mensagens}"></div>

        <form th:action="@{/cadastro}" th:object="${usuario}" method="post">
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" th:field="*{nome}" required maxlength="100" autocomplete="name">
            </div>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" th:field="*{email}" required autocomplete="email">
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required minlength="6" maxlength="72"
                       autocomplete="new-password" aria-describedby="senha-dica">
                <p class="dica" id="senha-dica">De 6 a 72 caracteres</p>
            </div>
            <div class="acoes-formulario">
                <button type="submit" class="botao">Criar conta</button>
            </div>
        </form>

        <p>Já tem conta? <a th:href="@{/login}">Entrar</a></p>
    </section>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>

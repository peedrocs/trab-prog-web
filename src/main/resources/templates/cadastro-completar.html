<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Completar cadastro')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecalho('cadastro')}"></header>
<main id="conteudo" class="container">
    <section class="formulario formulario-centralizado">
        <h1>Falta pouco</h1>
        <div th:replace="~{fragmentos :: mensagens}"></div>

        <p>Para comprar na loja precisamos do seu CPF. Ele vai como identificação do pagador no Mercado Pago.</p>

        <form th:action="@{/cadastro/completar}" method="post">
            <div class="campo">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" th:value="${cpf}" required inputmode="numeric" maxlength="14"
                       autocomplete="off" th:aria-invalid="${erroCpf != null} ? 'true'"
                       th:aria-describedby="${erroCpf != null} ? 'cpf-erro'">
                <p class="erro-campo" id="cpf-erro" th:if="${erroCpf}" th:text="${erroCpf}">CPF inválido</p>
            </div>
            <div class="acoes-formulario">
                <button type="submit" class="botao">Salvar e continuar</button>
            </div>
        </form>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="botao-texto">Sair sem completar</button>
        </form>
    </section>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Minha conta')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecalho('conta')}"></header>
<main id="conteudo" class="container">
    <div th:replace="~{fragmentos :: mensagens}"></div>
    <h1>Minha conta</h1>

    <form class="formulario" th:action="@{/conta}" th:object="${dados}" method="post">
        <fieldset class="grupo-campos">
            <legend>Dados pessoais</legend>

            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" th:field="*{nome}" required maxlength="100" autocomplete="name"
                       th:aria-invalid="${#fields.hasErrors('nome')} ? 'true'"
                       th:aria-describedby="${#fields.hasErrors('nome')} ? 'nome-erro'">
                <p class="erro-campo" id="nome-erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</p>
            </div>

            <div class="campo">
                <label for="telefone">Telefone (opcional)</label>
                <input type="tel" th:field="*{telefone}" maxlength="20" autocomplete="tel"
                       th:aria-invalid="${#fields.hasErrors('telefone')} ? 'true'"
                       th:aria-describedby="${#fields.hasErrors('telefone')} ? 'telefone-erro'">
                <p class="erro-campo" id="telefone-erro" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}">Erro</p>
            </div>

            <div class="grade-campos">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" th:value="${usuario.email}" readonly aria-describedby="fixos-dica">
                </div>
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" th:value="${usuario.cpfFormatado}" readonly aria-describedby="fixos-dica">
                </div>
            </div>
            <p class="dica" id="fixos-dica">O e-mail e o CPF não podem ser alterados.</p>
        </fieldset>

        <fieldset th:replace="~{fragmentos :: camposEndereco}"></fieldset>

        <div class="acoes-formulario">
            <button type="submit" class="botao">Salvar alterações</button>
        </div>
    </form>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
<script th:src="@{/js/cep.js}" defer></script>
</body>
</html>

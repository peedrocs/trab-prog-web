<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Pedido #' + ${pedido.id})}"></head>
<body>
<header th:replace="~{fragmentos :: cabecalho('pedidos')}"></header>
<main id="conteudo" class="container">
    <div th:replace="~{fragmentos :: mensagens}"></div>

    <div class="barra-titulo">
        <h1 th:text="|Pedido #${pedido.id}|">Pedido #1</h1>
        <a th:href="@{/pedidos}" class="botao botao-secundario">Voltar para meus pedidos</a>
    </div>

    <p>
        Realizado em <span th:text="${#temporals.format(pedido.dataCriacao, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</span>.
        Status: <span class="selo" th:classappend="|status-${pedido.status}|" th:text="${pedido.status.descricao}">Pago</span>
    </p>

    <div th:replace="~{fragmentos :: itensPedido(${pedido})}"></div>

    <section class="resumo" aria-labelledby="titulo-resumo">
        <h2 id="titulo-resumo">Resumo do pedido</h2>
        <dl th:replace="~{fragmentos :: resumoPedido(${pedido})}"></dl>
    </section>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head(|Pedido #${pedido.id}|)}"></head>
<body>
<header th:replace="~{fragmentos :: cabecalho('pedidos')}"></header>
<main id="conteudo" class="container">
    <div th:replace="~{fragmentos :: mensagens}"></div>

    <p><a th:href="@{/pedidos}">Voltar aos meus pedidos</a></p>

    <h1 th:text="|Pedido #${pedido.id}|">Pedido #1</h1>
    <p>
        Feito em <span th:text="${#temporals.format(pedido.data, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</span>.
        Status: <span th:class="|selo status-${pedido.status}|" th:text="${pedido.status.descricao}">Status</span>
    </p>

    <div th:replace="~{fragmentos :: itensPedido(${pedido})}"></div>

    <section class="resumo" aria-labelledby="titulo-resumo">
        <h2 id="titulo-resumo">Resumo</h2>
        <dl>
            <dt class="total">Total</dt>
            <dd class="total" th:text="${#numbers.formatCurrency(pedido.total)}">R$ 0,00</dd>
        </dl>
    </section>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Papelaria MGP'">Papelaria MGP</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
    <script th:src="@{/js/script.js}" defer></script>
</head>

<body>

<header th:fragment="cabecalho(paginaAtual)" class="cabecalho">
    <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
    <div class="container cabecalho-conteudo">
        <a class="logo" th:href="@{/}">Papelaria MGP</a>
        <details class="menu-sanfona">
            <summary><span aria-hidden="true">☰</span> Menu</summary>
            <nav aria-label="Menu principal">
                <ul class="menu">
                    <li class="usuario-logado" sec:authorize="isAuthenticated()">
                        Conectado como <span sec:authentication="name">usuario@email.com</span>
                    </li>
                    <li><a th:href="@{/}" th:aria-current="${paginaAtual == 'catalogo'} ? 'true'">Catálogo</a></li>
                    <li sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/admin}" th:aria-current="${paginaAtual == 'admin'} ? 'true'">Administração</a>
                    </li>
                    <li sec:authorize="isAnonymous()">
                        <a th:href="@{/login}" th:aria-current="${paginaAtual == 'login'} ? 'true'">Entrar</a>
                    </li>
                    <li sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="botao-link">Sair</button>
                        </form>
                    </li>
                </ul>
            </nav>
        </details>
    </div>
</header>

<footer th:fragment="rodape" class="rodape">
    <div class="container">
        <p>&copy; Papelaria MGP</p>
    </div>
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Criar senha nova')}"></head>
<body>
<header th:replace="~{fragmentos :: cabecalho('login')}"></header>
<main id="conteudo" class="container">
    <section class="formulario formulario-centralizado">
        <h1>Criar senha nova</h1>
        <div th:replace="~{fragmentos :: mensagens}"></div>

        <form th:action="@{/senha/redefinir}" th:object="${dados}" method="post">
            <input type="hidden" th:field="*{token}">
            <div class="campo">
                <label for="senha">Senha nova</label>
                <input type="password" id="senha" name="senha" required minlength="6" maxlength="72"
                       autocomplete="new-password"
                       th:aria-invalid="${#fields.hasErrors('senha')} ? 'true'"
                       th:aria-describedby="${#fields.hasErrors('senha')} ? 'senha-dica senha-erro' : 'senha-dica'">
                <p class="dica" id="senha-dica">De 6 a 72 caracteres</p>
                <p class="erro-campo" id="senha-erro" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}">Erro</p>
            </div>
            <div class="campo">
                <label for="confirmacao">Repita a senha nova</label>
                <input type="password" id="confirmacao" name="confirmacao" required maxlength="72"
                       autocomplete="new-password"
                       th:aria-invalid="${#fields.hasErrors('confirmacao')} ? 'true'"
                       th:aria-describedby="${#fields.hasErrors('confirmacao')} ? 'confirmacao-erro'">
                <p class="erro-campo" id="confirmacao-erro" th:if="${#fields.hasErrors('confirmacao')}" th:errors="*{confirmacao}">Erro</p>
            </div>
            <div class="acoes-formulario">
                <button type="submit" class="botao">Salvar senha</button>
            </div>
        </form>
    </section>
</main>
<footer th:replace="~{fragmentos :: rodape}"></footer>
</body>
</html>
